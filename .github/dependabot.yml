# Configuration Dependabot — mises à jour de versions automatiques.
# Doc : https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Dépendances Dart / Flutter (pubspec.yaml, à la racine)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Regroupe mineures + patch en une seule PR (moins de bruit)
      dart-mineures:
        update-types:
          - "minor"
          - "patch"

  # NB : l'écosystème "gradle" est volontairement EXCLU. Sur un projet Flutter,
  # les versions AGP / Kotlin / Gradle doivent rester dans la matrice que le
  # SDK Flutter valide -> les bumps isolés de Dependabot vers les toutes
  # dernières versions upstream peuvent casser le build sans apport sécurité
  # réel. La dérive par rapport à cette matrice est surveillée à la place par
  # le workflow .github/workflows/toolchain-drift.yml (hebdomadaire).

  # Actions GitHub utilisées dans .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
