name: Compatibilité Flutter stable

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-latest-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installer le dernier Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Publier le rapport des dépendances obsolètes
        run: |
          flutter pub outdated --json > /tmp/pub-outdated.json
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/pub-outdated.json", encoding="utf-8") as report:
              packages = json.load(report)["packages"]

          def version(entry, field):
              value = entry.get(field)
              return value["version"] if value else "—"

          outdated = [
              package for package in packages
              if version(package, "current") != version(package, "latest")
          ]
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Dépendances Pub obsolètes\n\n")
              summary.write(
                  "Rapport informatif : Dependabot reste chargé de créer les PR de mise à jour.\n\n"
              )
              if not outdated:
                  summary.write("Toutes les dépendances sont à jour.\n")
              else:
                  summary.write(
                      "| Dépendance | Type | Actuelle | Compatible | Dernière | Statut |\n"
                  )
                  summary.write("| --- | --- | ---: | ---: | ---: | --- |\n")
                  for package in outdated:
                      current = version(package, "current")
                      upgradable = version(package, "upgradable")
                      resolvable = version(package, "resolvable")
                      latest = version(package, "latest")
                      if current != upgradable:
                          status = "Mise à jour compatible"
                      elif current != resolvable:
                          status = "Modification de contrainte requise"
                      else:
                          status = "Bloquée par une dépendance parente ou le SDK"
                      summary.write(
                          f"| `{package['package']}` | {package['kind']} | "
                          f"{current} | {upgradable} | {latest} | {status} |\n"
                      )
          PY

      # Le format est contrôlé avec le SDK épinglé dans ci.yml : une évolution
      # du formateur ne doit pas transformer ce contrôle de compatibilité en
      # faux échec.
      - name: Analyser le projet
        run: flutter analyze

      - name: Lancer les tests
        run: flutter test

      - name: Compiler le Web
        run: flutter build web --release

      - name: Publier le build Web
        uses: actions/upload-artifact@v7
        with:
          name: classroom-sorter-web-latest-stable
          path: build/web
          if-no-files-found: error

  build-windows-latest-stable:
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installer le dernier Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler Windows
        run: flutter build windows --release

      - name: Publier le build Windows
        uses: actions/upload-artifact@v7
        with:
          name: classroom-sorter-windows-latest-stable
          path: build/windows/x64/runner/Release
          if-no-files-found: error
