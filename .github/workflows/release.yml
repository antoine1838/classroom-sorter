name: Release Android

# Seul workflow qui voit la clé de signature : réservé aux tags et au lancement
# manuel, jamais aux pull requests. La validation courante (format, builds de
# toutes les plateformes) vit dans ci.yml ; un tag peut pourtant viser un commit
# dont le CI n'a pas (encore) réussi, donc l'analyse et les tests sont rejoués
# ici, avant toute étape qui écrit le keystore.
on:
  push:
    tags: [ 'v*' ]     # un tag v1.0.0, v1.2.3... déclenche une Release
  workflow_dispatch:   # permet de lancer le build manuellement depuis l'onglet Actions

permissions:
  contents: read

# Jamais de cancel-in-progress : une release en cours ne doit pas être
# interrompue à mi-publication. Un groupe par ref (et non global) : GitHub ne
# garde qu'une exécution en attente par groupe et annulerait une release
# taguée en file derrière une autre.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # nécessaire pour que le job crée la Release
    # Repris par publish-play : ni le nom de l'artefact AAB ni le changelog à
    # envoyer ne doivent être redéduits ailleurs.
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lire et valider la version du pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml | tr -d '\r')
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Version pubspec invalide : $VERSION (attendu X.Y.Z+N)"
            exit 1
          fi

          APP_VERSION="${BASH_REMATCH[1]}"
          APP_BUILD_NUMBER="${BASH_REMATCH[2]}"

          if [[ "$GITHUB_REF_TYPE" == "tag" &&
                "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$APP_VERSION du pubspec."
            exit 1
          fi

          for locale in fr-FR en-US; do
            CHANGELOG="store/play/metadata/$locale/changelogs/$APP_BUILD_NUMBER.txt"
            if [[ ! -f "$CHANGELOG" ]]; then
              echo "::error::Changelog Play Store manquant : $CHANGELOG"
              exit 1
            fi
          done

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build-number=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      # Les secrets ne sont exposés qu'aux deux étapes qui en ont besoin (ce
      # contrôle et l'écriture du keystore) : ni `flutter analyze` ni
      # `flutter test` ne voient la clé de signature.
      - name: Vérifier les secrets de signature Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret de signature manquant : $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Installer Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle   # met en cache ~/.gradle/caches et ~/.gradle/wrapper (clé = hash des *.gradle*)

      - name: Installer Flutter 3.47.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # Rien ne se signe ni ne se publie si le code ne passe pas l'analyse et les
      # tests : ces deux étapes précèdent l'écriture du keystore.
      - name: Analyser le projet
        run: flutter analyze

      - name: Lancer les tests
        run: flutter test

      - name: Configurer la signature (keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compiler l'APK release
        # build-name et build-number viennent exclusivement du pubspec.
        # --target-platform : on ne compile que les ABI ARM (téléphones réels : arm64 + 32 bits).
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: Renommer l'APK selon la convention
        # Tag v1.0.0 -> classroom-sorter-1.0.0.apk ; lancement manuel -> classroom-sorter-build-<run>.apk
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            LABEL="$APP_VERSION"
          else
            LABEL="build-$GITHUB_RUN_NUMBER"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/classroom-sorter-$LABEL.apk"
          echo "APK_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "APK_PATH=build/app/outputs/flutter-apk/classroom-sorter-$LABEL.apk" >> "$GITHUB_ENV"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classroom-sorter-${{ env.APK_LABEL }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # --- App Bundle (.aab) : format requis par Google Play ---
      - name: Compiler l'AAB release (Play Store)
        # Pas de --target-platform : Play génère les APK par appareil à partir de
        # tous les ABI présents dans le bundle (arm64, arm32, x86_64).
        # build-name et build-number viennent exclusivement du pubspec.
        run: flutter build appbundle --release

      - name: Renommer l'AAB selon la convention
        run: |
          LABEL="${APK_LABEL}"
          mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/classroom-sorter-$LABEL.aab"
          echo "AAB_PATH=build/app/outputs/bundle/release/classroom-sorter-$LABEL.aab" >> "$GITHUB_ENV"

      - name: Publier l'AAB en artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classroom-sorter-${{ env.APK_LABEL }}-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error

      - name: Publier la Release GitHub (sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # APK (installable directement) + AAB (à téléverser sur Play).
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
          generate_release_notes: true

  # Dépose l'AAB et les notes de version dans la Play Console en BROUILLON :
  # rien n'atteint les utilisateurs avant votre clic « Envoyer en examen ».
  # Sans effet tant que la variable de dépôt GCP_WORKLOAD_IDENTITY_PROVIDER n'est
  # pas posée (procédure : store/play/README.md). Pas de clé stockée : le jeton
  # OIDC du job est échangé contre un accès Google éphémère, que la fédération
  # n'accorde qu'à l'environnement play-production (approbation manuelle).
  publish-play:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-production
    permissions:
      contents: read
      id-token: write  # jeton OIDC pour la fédération d'identité Google
    steps:
      - name: Checkout des notes de version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            store/play/metadata/fr-FR/changelogs
            store/play/metadata/en-US/changelogs
          persist-credentials: false

      - name: Récupérer l'AAB de la release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: classroom-sorter-${{ needs.build-release.outputs.version }}-aab
          path: build/aab

      - name: Préparer les notes de version
        env:
          BUILD_NUMBER: ${{ needs.build-release.outputs.build-number }}
        shell: bash
        # L'action attend un fichier whatsnew-<langue> par langue.
        run: |
          mkdir -p build/whatsnew
          for locale in fr-FR en-US; do
            cp "store/play/metadata/$locale/changelogs/$BUILD_NUMBER.txt" "build/whatsnew/whatsnew-$locale"
          done

      - name: S'authentifier auprès de Google (OIDC, sans clé)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Déposer le brouillon sur la piste production
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.antoine1838.plandeclasse
          releaseFiles: build/aab/classroom-sorter-${{ needs.build-release.outputs.version }}.aab
          track: production
          status: draft
          whatsNewDirectory: build/whatsnew
