name: Release Android

# Seul workflow qui voit la clé de signature : réservé aux tags et au lancement
# manuel, jamais aux pull requests. La validation courante (format, builds de
# toutes les plateformes) vit dans ci.yml ; un tag peut pourtant viser un commit
# dont le CI n'a pas (encore) réussi, donc l'analyse et les tests sont rejoués
# ici, avant toute étape qui écrit le keystore.
on:
  push:
    tags: [ 'v*' ]     # un tag v1.0.0, v1.2.3... déclenche une Release
  workflow_dispatch:   # permet de lancer le build manuellement depuis l'onglet Actions

permissions:
  contents: read

# Jamais de cancel-in-progress : une release en cours ne doit pas être
# interrompue à mi-publication. Un groupe par ref (et non global) : GitHub ne
# garde qu'une exécution en attente par groupe et annulerait une release
# taguée en file derrière une autre.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # nécessaire pour que le job crée la Release
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Lire et valider la version du pubspec
        shell: bash
        run: |
          VERSION=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml | tr -d '\r')
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Version pubspec invalide : $VERSION (attendu X.Y.Z+N)"
            exit 1
          fi

          APP_VERSION="${BASH_REMATCH[1]}"
          APP_BUILD_NUMBER="${BASH_REMATCH[2]}"

          if [[ "$GITHUB_REF_TYPE" == "tag" &&
                "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$APP_VERSION du pubspec."
            exit 1
          fi

          for locale in fr-FR en-US; do
            CHANGELOG="store/play/metadata/$locale/changelogs/$APP_BUILD_NUMBER.txt"
            if [[ ! -f "$CHANGELOG" ]]; then
              echo "::error::Changelog Play Store manquant : $CHANGELOG"
              exit 1
            fi
          done

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> "$GITHUB_ENV"

      # Les secrets ne sont exposés qu'aux deux étapes qui en ont besoin (ce
      # contrôle et l'écriture du keystore) : ni `flutter analyze` ni
      # `flutter test` ne voient la clé de signature.
      - name: Vérifier les secrets de signature Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret de signature manquant : $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle   # met en cache ~/.gradle/caches et ~/.gradle/wrapper (clé = hash des *.gradle*)

      - name: Installer Flutter 3.47.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # Rien ne se signe ni ne se publie si le code ne passe pas l'analyse et les
      # tests : ces deux étapes précèdent l'écriture du keystore.
      - name: Analyser le projet
        run: flutter analyze

      - name: Lancer les tests
        run: flutter test

      - name: Configurer la signature (keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compiler l'APK release
        # build-name et build-number viennent exclusivement du pubspec.
        # --target-platform : on ne compile que les ABI ARM (téléphones réels : arm64 + 32 bits).
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: Renommer l'APK selon la convention
        # Tag v1.0.0 -> classroom-sorter-1.0.0.apk ; lancement manuel -> classroom-sorter-build-<run>.apk
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            LABEL="$APP_VERSION"
          else
            LABEL="build-$GITHUB_RUN_NUMBER"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/classroom-sorter-$LABEL.apk"
          echo "APK_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "APK_PATH=build/app/outputs/flutter-apk/classroom-sorter-$LABEL.apk" >> "$GITHUB_ENV"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v7
        with:
          name: classroom-sorter-${{ env.APK_LABEL }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # --- App Bundle (.aab) : format requis par Google Play ---
      - name: Compiler l'AAB release (Play Store)
        # Pas de --target-platform : Play génère les APK par appareil à partir de
        # tous les ABI présents dans le bundle (arm64, arm32, x86_64).
        # build-name et build-number viennent exclusivement du pubspec.
        run: flutter build appbundle --release

      - name: Renommer l'AAB selon la convention
        run: |
          LABEL="${APK_LABEL}"
          mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/classroom-sorter-$LABEL.aab"
          echo "AAB_PATH=build/app/outputs/bundle/release/classroom-sorter-$LABEL.aab" >> "$GITHUB_ENV"

      - name: Publier l'AAB en artefact
        uses: actions/upload-artifact@v7
        with:
          name: classroom-sorter-${{ env.APK_LABEL }}-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error

      - name: Publier la Release GitHub (sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # APK (installable directement) + AAB (à téléverser sur Play).
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
          generate_release_notes: true
