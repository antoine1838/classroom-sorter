name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

# Moindre privilège : le job ne fait que checkout + lancer les tests + envoyer
# l'analyse à SonarCloud (authentifiée par SONAR_TOKEN, pas par GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7
        with:
          # Historique complet : nécessaire pour que SonarCloud calcule
          # correctement le "nouveau code" et le blame.
          fetch-depth: 0

      - name: Installer Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Lancer les tests (avec couverture)
        run: flutter test --coverage

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
