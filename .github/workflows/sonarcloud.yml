name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

# Moindre privilège : le job ne fait que checkout + lancer les tests + envoyer
# l'analyse à SonarCloud (authentifiée par SONAR_TOKEN, pas par GITHUB_TOKEN).
permissions:
  contents: read

# Une PR mise à jour annule son analyse en cours ; jamais les push sur main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : nécessaire pour que SonarCloud calcule
          # correctement le "nouveau code" et le blame.
          fetch-depth: 0

      - name: Installer Flutter 3.47.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Lancer les tests (avec couverture)
        run: flutter test --coverage

      # Une PR venue d'un fork n'a pas accès aux secrets : sans SONAR_TOKEN,
      # l'analyse échouerait et la PR afficherait un contrôle rouge qui n'a rien
      # à voir avec son code. Les tests ci-dessus tournent quand même.
      - name: Analyse SonarCloud
        if: github.event.pull_request.head.repo.fork != true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
