name: Qualité et builds multiplateformes

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

# Une PR mise à jour annule sa validation en cours (seul le dernier commit
# compte). Les push sur main ne sont jamais annulés : chaque commit publié
# garde sa validation complète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Vérifier le format Dart
        run: dart format --output=none --set-exit-if-changed lib test tool

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Analyser le projet
        run: flutter analyze

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Lancer les tests
        run: flutter test

      # Un test golden en échec écrit ses images (référence, rendu, différence)
      # dans test/failures/ : sans elles, impossible de voir ce qui diffère.
      - name: Publier les images de diff des golden
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: test/failures
          if-no-files-found: ignore

  # Les builds ne démarrent que si le code est propre : un format, une analyse
  # ou un test en échec évite de lancer des builds lourds (macOS, Android) pour
  # rien, et empêche de publier un artefact issu d'un code qui ne passe pas.
  build-web:
    needs: [ format, analyze, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler le Web
        run: flutter build web --release

      - name: Publier le build Web
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classroom-sorter-web
          path: build/web
          if-no-files-found: error

  build-windows:
    needs: [ format, analyze, test ]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDK sur D: et caches SDK/pub distincts : mesuré ≈ 40 s plus rapide que
      # `cache: true` sur C:\hostedtoolcache (restauration du SDK de 1,8 Go).
      # La clé du SDK porte la version de Flutter : la changer avec elle.
      - name: Restaurer le SDK Flutter
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:/flutter/stable-3.47.6-x64
          key: flutter-sdk-windows-d-3.47.6

      - name: Restaurer le cache pub
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: flutter-pub-windows-${{ hashFiles('pubspec.lock') }}

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: false
          cache-path: D:/flutter/stable-3.47.6-x64

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler Windows
        run: flutter build windows --release

      - name: Publier le build Windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classroom-sorter-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  build-android:
    needs: [ format, analyze, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lire et valider la version du pubspec
        shell: bash
        run: |
          VERSION=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml | tr -d '\r')
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Version pubspec invalide : $VERSION (attendu X.Y.Z+N)"
            exit 1
          fi

      - name: Installer Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler l'APK release
        # Aucune clé de signature ici (voir release.yml) : build.gradle.kts retombe
        # sur la clé de debug. build-name et build-number viennent du pubspec.
        # ABI ARM seulement : les téléphones réels, compilation plus rapide.
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: Renommer l'APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/classroom-sorter-build-$GITHUB_RUN_NUMBER.apk"
          echo "APK_LABEL=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classroom-sorter-${{ env.APK_LABEL }}
          path: build/app/outputs/flutter-apk/classroom-sorter-${{ env.APK_LABEL }}.apk
          if-no-files-found: error

  build-ios:
    needs: [ format, analyze, test ]
    # iOS ne se compile que sur macOS. Build NON SIGNÉ (--no-codesign) : il valide
    # que le code iOS compile ; le .app n'est pas installable sur un iPhone.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lire et valider la version du pubspec
        shell: bash
        run: |
          VERSION=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml | tr -d '\r')
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Version pubspec invalide : $VERSION (attendu X.Y.Z+N)"
            exit 1
          fi

          echo "APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler l'app iOS (non signée)
        # build-name et build-number viennent exclusivement du pubspec.
        run: flutter build ios --release --no-codesign

      - name: Empaqueter le .app (zip)
        # ditto préserve correctement la structure du bundle .app.
        run: |
          LABEL="$APP_VERSION-$APP_BUILD_NUMBER"
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app "plan-de-classe-ios-$LABEL-unsigned.zip"
          echo "IOS_LABEL=$LABEL" >> "$GITHUB_ENV"

      - name: Publier le .app en artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-de-classe-ios-${{ env.IOS_LABEL }}-unsigned
          path: build/ios/iphoneos/plan-de-classe-ios-${{ env.IOS_LABEL }}-unsigned.zip
          if-no-files-found: error

  benchmark-seating-engine:
    needs: [ format, analyze, test ]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout de la révision courante
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current

      - name: Checkout de main comme référence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: baseline

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Préparer la référence
        working-directory: baseline
        run: flutter pub get

      - name: Mesurer la référence main
        working-directory: baseline
        run: >-
          dart run tool/seating_engine_benchmark.dart
          --json-out ../benchmark-main.json

      - name: Préparer la révision courante
        working-directory: current
        run: flutter pub get

      - name: Mesurer et comparer la révision courante
        working-directory: current
        run: >-
          dart run tool/seating_engine_benchmark.dart
          --json-out ../benchmark-current.json
          --compare ../benchmark-main.json
          --threshold 0.20

      - name: Publier le résumé
        if: always()
        env:
          BASELINE: benchmark-main.json
          CURRENT: benchmark-current.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text())

          if not all(Path(path).exists() for path in (os.environ["BASELINE"], os.environ["CURRENT"])):
              print("Le benchmark n'a pas produit les deux rapports.")
              raise SystemExit(0)

          baseline = read(os.environ["BASELINE"])["metrics"]["generate"]
          current = read(os.environ["CURRENT"])["metrics"]["generate"]
          ratio = current["p95Us"] / baseline["p95Us"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Performance du moteur de placement\n\n")
              summary.write("| Révision | Médiane génération | P95 génération |\n")
              summary.write("| --- | ---: | ---: |\n")
              summary.write(f"| `main` | {baseline['medianUs'] / 1000:.1f} ms | {baseline['p95Us'] / 1000:.1f} ms |\n")
              summary.write(f"| PR | {current['medianUs'] / 1000:.1f} ms | {current['p95Us'] / 1000:.1f} ms |\n\n")
              summary.write(f"P95 PR / main : **{ratio:.1%}** (seuil : **120.0%**).\n")
          PY

      - name: Archiver les rapports de performance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seating-engine-benchmark
          path: |
            benchmark-main.json
            benchmark-current.json
          if-no-files-found: warn
