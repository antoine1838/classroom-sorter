sonar.projectKey=antoine1838_classroom-sorter
sonar.organization=antoine1838

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8
# Les bindings Dart issus des catalogues ARB sont régénérés par Flutter ;
# leur contenu miroir ne doit pas fausser duplication ni couverture.
sonar.exclusions=lib/l10n/generated/**

# Rapport de couverture généré par `flutter test --coverage`.
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Le banc d'essai du moteur (tool/seating_engine_benchmark*.dart) vit hors de
# `sonar.sources=lib` : il n'est ni analysé ni compté dans la couverture, rien
# à exclure pour lui ici. Seuls les bindings l10n générés sont listés ; c'est
# redondant avec `sonar.exclusions` ci-dessus, gardé pour que la règle de
# couverture reste explicite.
sonar.coverage.exclusions=lib/l10n/generated/**
