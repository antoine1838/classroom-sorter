sonar.projectKey=antoine1838_classroom-sorter
sonar.organization=antoine1838

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Rapport de couverture généré par `flutter test --coverage`.
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Bancs d'essai : du code de diagnostic avec leur propre `main()`, jamais
# embarqué dans l'app (dont le point d'entrée reste lib/main.dart) et destiné à
# être manipulé à la main sur un appareil. Les tester automatiquement n'aurait
# aucun sens, donc on les sort de la métrique de couverture — mais pas de
# l'analyse, qui continue d'y chercher des défauts.
sonar.coverage.exclusions=lib/prototypes/**
